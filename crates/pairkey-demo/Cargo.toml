[package]
name = "pairkey-demo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
axum.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
solana-sdk.workspace = true
rand_core.workspace = true
ed25519-dalek.workspace = true
bincode.workspace = true
borsh.workspace = true
base64.workspace = true
reqwest.workspace = true
pairkey-sdk = { path = "../../sdk" }
pairkey-types = { path = "../pairkey-types" }
pairkey-core = { path = "../pairkey-core" }
pairkey-signing = { path = "../pairkey-signing" }
pairkey-coordinator = { path = "../pairkey-coordinator" }
pair-registry = { path = "../../programs/pair-registry", features = ["no-entrypoint"] }
example-controller = { path = "../../programs/example-controller", features = ["no-entrypoint"] }
sha3 = "=0.10.8"

[dev-dependencies]
pairkey-worker = { path = "../pairkey-worker", features = ["test-fixtures"] }
litesvm.workspace = true
p256 = { version = "=0.13.2", features = ["ecdsa"] }
sha2.workspace = true
ring = "=0.17.14"
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
