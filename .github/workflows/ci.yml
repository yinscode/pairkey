name: PairKey CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pairkey-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  local-platform:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: 1.88.0
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libssl-dev libudev-dev clang cmake protobuf-compiler python3
      - name: Install pinned host compiler
        run: rustup toolchain install 1.88.0 --profile minimal --component rustfmt --component clippy
      - name: Install checksum-pinned chain tools
        run: python3 scripts/install-ci-tools.py
      - name: Run local platform gate
        run: bash scripts/ci.sh
      - name: Upload public evidence and gate logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pairkey-ci-evidence
          path: .local/ci-report/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14
